<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="リマインダー"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>カウントダウン・リマインダー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#1c1c1e;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 16px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:32px;margin:0;letter-spacing:-.8px}#count{color:#8e8e93}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #007aff;outline-offset:2px}.add,.primary{border:0;border-radius:13px;background:#007aff;color:white;padding:12px 16px;font-weight:650;min-height:44px}.card{background:white;border-radius:16px;overflow:hidden}.section{font-size:14px;font-weight:700;color:#777;padding:17px 18px 12px}.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:62px;border-top:1px solid #ededf0}.check{border:2px solid #b4b4b9;border-radius:50%;height:27px;width:27px;flex-shrink:0;background:white}.item{flex:1;text-align:left;border:0;background:none;min-width:0;padding:4px 0;overflow-wrap:anywhere;font-size:16px}.due{font-size:13px;color:#b35b00;margin-top:4px}.chevron{color:#bbb;font-size:24px}.more{border:0;border-top:1px solid #eee;background:white;width:100%;min-height:48px;color:#007aff;font-weight:600}.hidden{display:none!important}.panel{margin-top:18px;padding:18px;background:white;border-radius:16px}.panel h2{margin:0 0 16px;font-size:19px}label{display:block;font-size:14px;font-weight:600;margin:12px 0}input{display:block;margin-top:7px;width:100%;font-size:16px;border:1px solid #d1d1d6;border-radius:11px;padding:12px;background:white;min-height:46px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.secondary,.danger{border:1px solid #ddd;border-radius:12px;background:white;padding:11px 15px;min-height:44px}.danger{color:#c62828;border-color:#efb5b5}.hint{font-size:12px;color:#777;line-height:1.6;margin-top:16px}.empty{padding:16px;color:#777}#notice{font-size:13px;color:#666;min-height:20px;margin-top:10px}
</style></head><body><main><header><h1>リマインダー <span id="count">0</span></h1><button class="add" id="add" type="button">＋ 新規</button></header><div class="card"><div class="section">新規セクション</div><div id="list"></div><button id="more" class="more hidden" type="button"></button></div><section id="editor" class="panel hidden"><h2 id="editorHeading">予定を追加</h2><form id="form"><label>タイトル<input id="title" required maxlength="200" placeholder="やることを入力"></label><label>日付（任意）<input id="date" type="date"></label><div class="actions"><button class="primary" type="submit">保存</button><button class="secondary" type="button" id="cancel">キャンセル</button><button class="danger hidden" type="button" id="delete">削除</button></div></form></section><div id="notice" role="status" aria-live="polite"></div><p class="hint">日付未設定の予定を上に、日付がある予定は期限が近い順に表示します。完了チェックで削除します。データはこの端末のブラウザ内に保存されます。ブラウザのデータを消去すると予定も消えるため、大切な予定は別途控えてください。</p></main>
<script>
(()=>{'use strict';const KEY='countdown-reminder-v1';const $=id=>document.getElementById(id);let tasks=[],nextId=1,editing=null,expanded=false;try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))tasks=data.filter(t=>t&&Number.isSafeInteger(t.id)&&typeof t.title==='string'&&typeof t.date==='string').slice(0,10000);nextId=Math.max(0,...tasks.map(t=>t.id))+1}catch(e){$('notice').textContent='保存データを読み込めませんでした。'}function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}catch(e){$('notice').textContent='保存できませんでした。端末の空き容量やブラウザ設定をご確認ください。';return false}}function compare(a,b){if(!a.date&&!b.date)return a.id-b.id;if(!a.date)return -1;if(!b.date)return 1;return a.date.localeCompare(b.date)||a.id-b.id}function remaining(s){const [y,m,d]=s.split('-').map(Number),now=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}function dueText(s){const d=remaining(s);return d>0?'あと'+d+'日':d===0?'今日':'期限から'+Math.abs(d)+'日経過'}function close(){$('editor').classList.add('hidden');editing=null}function open(t){editing=t?t.id:null;$('editorHeading').textContent=t?'予定を編集':'予定を追加';$('title').value=t?t.title:'';$('date').value=t?t.date:'';$('delete').classList.toggle('hidden',!t);$('editor').classList.remove('hidden');$('title').focus();$('editor').scrollIntoView({behavior:'smooth',block:'nearest'})}function render(){const list=$('list');list.replaceChildren();$('count').textContent=tasks.length;const sorted=[...tasks].sort(compare);if(!sorted.length){const p=document.createElement('div');p.className='empty';p.textContent='予定はありません。「＋ 新規」で追加できます。';list.append(p)}(expanded?sorted:sorted.slice(0,6)).forEach(t=>{const row=document.createElement('div');row.className='row';const check=document.createElement('button');check.type='button';check.className='check';check.setAttribute('aria-label',t.title+'を完了して削除');check.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();$('notice').textContent='「'+t.title+'」を完了して削除しました。';render()});const item=document.createElement('button');item.type='button';item.className='item';const name=document.createElement('div');name.textContent=t.title;item.append(name);if(t.date){const due=document.createElement('div');due.className='due';due.textContent=t.date.replaceAll('-','/')+' · '+dueText(t.date);item.append(due)}item.addEventListener('click',()=>open(t));const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');row.append(check,item,arrow);list.append(row)});const more=$('more');more.classList.toggle('hidden',sorted.length<=6);more.textContent=expanded?'閉じる':'もっと見る（残り'+Math.max(0,sorted.length-6)+'件）'}$('add').addEventListener('click',()=>open(null));$('cancel').addEventListener('click',close);$('more').addEventListener('click',()=>{expanded=!expanded;render()});$('form').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim(),date=$('date').value;if(!title)return;if(editing!==null){const t=tasks.find(x=>x.id===editing);if(t){t.title=title;t.date=date}}else tasks.push({id:nextId++,title,date});save();close();render()});$('delete').addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==editing);save();close();render()});render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(!document.hidden)render()},60000);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
